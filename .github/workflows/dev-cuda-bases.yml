name: Dev — CUDA base experiments (DR-1170)

# Builds the experimental CUDA base images so we can A/B test them on real GPUs
# (Blackwell / CUDA 13 vs older CUDA 12.x hosts). Pushes to Docker Hub tagged
# with the sanitized branch name, e.g.
#   runpod/worker-comfyui:fix-dr-1170-ngc-base-blackwell-base-ngc26.05
#   runpod/worker-comfyui:fix-dr-1170-ngc-base-blackwell-base-cuda12.8.1
on:
  workflow_dispatch:
  push:
    branches:
      - "fix/dr-1170-ngc-base-blackwell"

jobs:
  build:
    runs-on: [blacksmith-8vcpu-ubuntu-2204, linux]
    permissions:
      contents: read
    env:
      NGC_API_KEY: ${{ secrets.NGC_API_KEY }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - base-ngc
          - base-cuda12-8-1
          - sdxl-ngc
          - sdxl-cuda128
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clear space to remove unused folders
        run: |
          rm -rf /usr/share/dotnet
          rm -rf /opt/ghc
          rm -rf "/usr/local/share/boost"
          rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The NGC PyTorch container is normally pullable anonymously. If your org's
      # pull is gated, add an NGC_API_KEY secret and this step logs in for it.
      - name: Login to NVIDIA NGC (nvcr.io)
        if: ${{ env.NGC_API_KEY != '' }}
        uses: docker/login-action@v3
        with:
          registry: nvcr.io
          username: $oauthtoken
          password: ${{ env.NGC_API_KEY }}

      - name: blacksmith docker layer cache
        uses: useblacksmith/build-push-action@v1
        with:
          setup-only: true

      - name: Set environment variables
        run: |
          echo "DOCKERHUB_REPO=${{ vars.DOCKERHUB_REPO }}" >> $GITHUB_ENV
          echo "DOCKERHUB_IMG=${{ vars.DOCKERHUB_IMG }}" >> $GITHUB_ENV
          echo "HUGGINGFACE_ACCESS_TOKEN=${{ secrets.HUGGINGFACE_ACCESS_TOKEN }}" >> $GITHUB_ENV
          echo "RELEASE_VERSION=${GITHUB_REF##refs/heads/}" | sed 's/\//-/g' >> $GITHUB_ENV

      - name: Build and push ${{ matrix.target }} to Docker Hub
        uses: docker/bake-action@v2
        with:
          push: true
          targets: ${{ matrix.target }}
          set: |
            *.args.DOCKERHUB_REPO=${{ env.DOCKERHUB_REPO }}
            *.args.DOCKERHUB_IMG=${{ env.DOCKERHUB_IMG }}
            *.args.RELEASE_VERSION=${{ env.RELEASE_VERSION }}
            *.args.HUGGINGFACE_ACCESS_TOKEN=${{ env.HUGGINGFACE_ACCESS_TOKEN }}
